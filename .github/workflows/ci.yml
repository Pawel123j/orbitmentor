name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Lint, typy, testy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalacja zależności
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Kontrola typów
        run: npm run typecheck

      - name: Testy
        run: npm test

      - name: Audyt zależności
        # Blokujemy na `high`. Po naprawie w tym repozytorium nie ma już ani
        # jednej podatności wysokiej ani krytycznej, więc próg jest realny
        # do utrzymania — w odróżnieniu od projektów, w których naprawa
        # wymagałaby migracji SDK.
        run: npm audit --audit-level=high
