name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Lint, typy, testy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalacja zależności
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Kontrola typów
        run: npm run typecheck

      - name: Testy
        run: npm test

      - name: Regresje bezpieczeństwa i zgodności zależności
        run: npm run test:security

      - name: Audyt zależności
        # Aktualny audit jest obowiązkowy również po migracji SDK.
        run: npm run security:check
