name: Browser regression
on: [push, pull_request]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx expo export --platform web
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r e2e/requirements.txt
      # Ubuntu's AppArmor policy permits the installed Chrome binary to use its
      # sandbox. Downloaded Playwright Chromium can be denied user namespaces.
      - name: Check system Chrome
        run: /usr/bin/google-chrome --version
      - run: python -m pytest -q e2e
        env:
          PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH: /usr/bin/google-chrome
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-logs
          path: e2e/artifacts
